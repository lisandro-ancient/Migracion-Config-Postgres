# BORRADOR generado desde el esquema real de EMPRESAS_USUARIOS (config_microsip.generador).
# Revisar cada regla antes de pasar a 'estado: vigente'. Nada aquí es una decisión de negocio verificada.
# Filas en origen al generar: 0
#
# - FK real en origen: EMPRESA_ID -> EMPRESAS.EMPRESA_ID (validada vía catálogo ref_empresas)
# - FK real en origen: USUARIO_ID -> USUARIOS.USUARIO_ID (validada vía catálogo ref_usuarios)

fuente: config
estado: borrador
tabla_origen: EMPRESAS_USUARIOS
tabla_destino: empresas_usuarios
llave_primaria: [usuario_id, empresa_id]
fixture: fixtures/config/empresas_usuarios_raw_snapshot.json
depende_de: [ref_empresas, ref_usuarios]
catalogos:
  - nombre: ref_empresas
    tipo: tabla
    tabla_origen: EMPRESAS
    fixture: fixtures/config/ref_empresas_raw_snapshot.json
    columnas: [empresa_id]
    mapeo_columnas: [["EMPRESA_ID", empresa_id]]
    al_borrar: cascade
  - nombre: ref_usuarios
    tipo: tabla
    tabla_origen: USUARIOS
    fixture: fixtures/config/ref_usuarios_raw_snapshot.json
    columnas: [usuario_id]
    mapeo_columnas: [["USUARIO_ID", usuario_id]]
    al_borrar: cascade

campos:
  - {origen: "USUARIO_ID", destino: usuario_id, regla: entero, nulo_permitido: false, catalogo_fk: ref_usuarios}
  - {origen: "EMPRESA_ID", destino: empresa_id, regla: entero, nulo_permitido: false, catalogo_fk: ref_empresas}
